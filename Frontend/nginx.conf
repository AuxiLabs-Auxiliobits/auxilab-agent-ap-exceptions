server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version in the Server header.
    server_tokens off;

    # --- Security headers (applied to every response via `always`) --------- #
    # CSP allows Clerk (auth widget + its frame/worker) and same-origin XHR to
    # the reverse-proxied API. Tighten the *.clerk.* / *.clerk.accounts.dev
    # hosts to your instance's domains if you want a stricter policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; frame-src 'self' https://*.clerk.accounts.dev https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is only meaningful over HTTPS; safe to send — browsers ignore it on
    # plain HTTP. Enable in the TLS-terminating layer if that's upstream.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: serve index.html for any non-file route (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API to the backend container so the SPA can call
    # same-origin paths (no CORS, no baked-in API host).
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /healthz { proxy_pass http://api:8000; }
    location = /readyz  { proxy_pass http://api:8000; }
}

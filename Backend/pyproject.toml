[project]
name = "ap-exception-agent"
version = "0.1.0"
description = "AP Exception Handling Agent — LangGraph-orchestrated workflow with selective Claude AI nodes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "anthropic>=0.40",
    "google-genai>=1.0,<2.0",
    "openai>=1.50",
    "langgraph>=0.2.40",
    "langchain-core>=0.3",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "supabase>=2.7",
    "pyjwt[crypto]>=2.9",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Generated migrations and scratch verification scripts are not hand-linted.
extend-exclude = ["alembic", "tests/_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = [
    "B008",   # function-call-in-default-argument — the standard FastAPI Depends/Body/Query pattern
    "UP042",  # replace-str-enum — deliberate (str, Enum) for cross-version behavior
]

[tool.ruff.lint.per-file-ignores]
# ORM column definitions and HTML email templates legitimately run long.
"app/db/models.py" = ["E501"]
"app/comms/email_template.py" = ["E501"]
"app/comms/marketing_email.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
# Pragmatic strictness: catch real type errors without drowning in third-party
# stub gaps. Tighten module-by-module over time (raise to `strict = true`).
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
# Generated migrations and scratch scripts are not hand-typed.
exclude = ["^alembic/", "^tests/_"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

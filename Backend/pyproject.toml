[project]
name = "ap-exception-agent"
version = "0.1.0"
description = "AP Exception Handling Agent — LangGraph-orchestrated workflow with selective Claude AI nodes"
requires-python = ">=3.11"
# Core = what it takes to run the agent itself: `python cli.py` and `python
# ui.py`, offline in mock mode or against a provider API. The FastAPI service,
# its datastores and its auth stack live in the `server` extra below, so
# `pip install -e .` stays lean.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "langgraph>=0.2.40",
    # Encrypts per-org provider secrets; imported on every run via
    # app/security/crypto.py, so it is core rather than server-only.
    "cryptography>=42.0",
    # Multi-provider AI clients. All three are core: the provider is chosen at
    # runtime from config, and any of them may be the one that is configured.
    "anthropic>=0.40",
    "google-genai>=1.0,<2.0",
    "openai>=1.50",
    # Browser interface (`python ui.py`) — the primary entry point, so it is a
    # core dependency rather than an extra: `pip install -e .` is all a new
    # user needs. (`python cli.py` does not require it.)
    "gradio>=4.44",
]

[project.optional-dependencies]
# The full API service: `pip install -e ".[server]"`, then
# `uvicorn app.api.main:app`. Includes the durable run stores (SQLAlchemy /
# Supabase), auth, rate limiting and outbound comms. The agent degrades
# cleanly without these — runs simply persist to the local snapshot only.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "supabase>=2.7",
    "pyjwt[crypto]>=2.9",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.0",
    # .xlsx attachments on digest / vendor emails (app/comms/attachments.py).
    "openpyxl>=3.1",
]
dev = [
    # Most of the suite exercises the API, so dev pulls in the server extra.
    # tests/test_standalone_mock.py deliberately does not, and passes on a
    # core-only install.
    "ap-exception-agent[server]",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Generated migrations and scratch verification scripts are not hand-linted.
extend-exclude = ["alembic", "tests/_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = [
    "B008",   # function-call-in-default-argument — the standard FastAPI Depends/Body/Query pattern
    "UP042",  # replace-str-enum — deliberate (str, Enum) for cross-version behavior
]

[tool.ruff.lint.per-file-ignores]
# ORM column definitions and HTML email templates legitimately run long.
"app/db/models.py" = ["E501"]
"app/comms/email_template.py" = ["E501"]
"app/comms/marketing_email.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
# Pragmatic strictness: catch real type errors without drowning in third-party
# stub gaps. Tighten module-by-module over time (raise to `strict = true`).
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
# Generated migrations and scratch scripts are not hand-typed.
exclude = ["^alembic/", "^tests/_"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
